</style></head><body><header class="head"><div class="brand">Fidélité Catholique</div><h1>Ordo liturgique</h1><p>Octobre 2026</p></header><main class="wrap"><div class="month">Octobre 2026</div><div class="gold"></div><div id="list"></div></main>
<div class="modal" id="modal"><div class="sheet"><div class="sheethead"><span class="close" onclick="closeM()">×</span><h2 id="mtitle"></h2><div id="msub"></div></div><div class="tabs"><button id="tm" onclick="tab('messe')">MESSE</button><button id="tn" onclick="tab('noticia')">NOTICIA</button></div><div class="panel" id="panel"></div></div></div>
<script>const DATA=[{"date":"2026-10-01","jour":"jeudi","fete":"Saint Rémi","detail":"Évêque et confesseur","classe":"3e cl.","couleur":"blanc","notes":"","noticia":"Évêque de Reims, saint Rémi est l’une des grandes figures de l’évangélisation des Francs. Il instruisit Clovis dans la foi et le baptisa à Reims. Son long épiscopat fut marqué par la prédication, l’organisation de l’Église et le souci de conduire le peuple franc à la foi catholique."},{"date":"2026-10-02","jour":"vendredi","fete":"Les Saints Anges Gardiens","detail":"","classe":"3e cl.","couleur":"blanc","notes":"1er vendredi du mois · Abstinence · Indulgence plénière","noticia":"L’Église honore les anges auxquels la Providence confie la garde des hommes. Cette fête rappelle leur assistance invisible, leur protection dans les dangers et leur mission de nous conduire vers Dieu."},{"date":"2026-10-03","jour":"samedi","fete":"Sainte Thérèse de l’Enfant-Jésus","detail":"Vierge · patronne secondaire de la France","classe":"2e cl.","couleur":"blanc","notes":"1er samedi du mois · Indulgence plénière · Cinq premiers samedis","noticia":"Née à Alençon en 1873, Thérèse Martin entra très jeune au Carmel de Lisieux. Elle enseigna la « petite voie » de confiance et d’abandon à Dieu. Morte en 1897, elle devint patronne des missions et patronne secondaire de la France."},{"date":"2026-10-04","jour":"dimanche","fete":"Solennité obligatoire de Notre-Dame du Saint Rosaire","detail":"","classe":"2e cl.","couleur":"blanc","notes":"Saint François d’Assise","noticia":"Cette solennité honore la Sainte Vierge sous le titre de Notre-Dame du Rosaire. Elle rappelle la puissance de cette prière contemplative qui fait méditer les mystères du Christ avec Marie."},{"date":"2026-10-05","jour":"lundi","fete":"De la férie","detail":"","classe":"4e cl.","couleur":"vert","notes":"Saints Placide et ses compagnons, martyrs","noticia":"Jour de férie du temps après la Pentecôte. La liturgie reprend le formulaire du dimanche correspondant, en laissant davantage de place à la continuité du cycle temporal."},{"date":"2026-10-06","jour":"mardi","fete":"Saint Bruno","detail":"Confesseur","classe":"3e cl.","couleur":"blanc","notes":"","noticia":"Né vers 1030, saint Bruno fut maître à Reims avant de se retirer dans la solitude. Fondateur de la Chartreuse, il donna naissance à une forme de vie monastique unissant silence, prière, pénitence et vie fraternelle."},{"date":"2026-10-07","jour":"mercredi","fete":"Notre-Dame du Saint Rosaire","detail":"","classe":"2e cl.","couleur":"blanc","notes":"Saint Marc, pape et confesseur","noticia":"La fête du Très Saint Rosaire invite à contempler avec la Vierge Marie les mystères de la vie du Christ. Elle fut particulièrement développée dans l’Église après la victoire de Lépante en 1571."},{"date":"2026-10-08","jour":"jeudi","fete":"Sainte Brigitte de Suède","detail":"Veuve","classe":"3e cl.","couleur":"blanc","notes":"Saints Serge, Bacchus, Marcel et Apulée, martyrs","noticia":"Veuve"},{"date":"2026-10-09","jour":"vendredi","fete":"Saint Jean Léonardi","detail":"Confesseur","classe":"3e cl.","couleur":"blanc","notes":"Saints Denis, Rustique et Eleuthère, martyrs · Abstinence","noticia":"Prêtre italien du XVIe siècle, Jean Léonardi travailla à la réforme du clergé et à l’enseignement de la doctrine chrétienne. Il fonda les Clercs réguliers de la Mère de Dieu et soutint l’œuvre missionnaire."},{"date":"2026-10-10","jour":"samedi","fete":"Saint François Borgia","detail":"Confesseur","classe":"3e cl.","couleur":"blanc","notes":"","noticia":"Ancien duc de Gandie et haut dignitaire de la cour impériale, François Borgia renonça aux honneurs du monde après la mort de son épouse. Entré dans la Compagnie de Jésus, il en devint le troisième supérieur général."},{"date":"2026-10-11","jour":"dimanche","fete":"XXe dimanche après la Pentecôte","detail":"","classe":"2e cl.","couleur":"vert","notes":"Dimanche des Missions · Oraisons pour la Propagation de la Foi","noticia":"Brève notice à compléter."},{"date":"2026-10-12","jour":"lundi","fete":"De la férie","detail":"","classe":"4e cl.","couleur":"vert","notes":"","noticia":"Jour de férie du temps après la Pentecôte. La liturgie reprend le formulaire du dimanche correspondant, en laissant davantage de place à la continuité du cycle temporal."},{"date":"2026-10-13","jour":"mardi","fete":"Saint Édouard","detail":"Confesseur","classe":"3e cl.","couleur":"blanc","notes":"","noticia":"Édouard le Confesseur, roi d’Angleterre au XIe siècle, fut renommé pour sa piété, sa justice et son attention aux pauvres. Son règne resta associé au développement de l’abbaye de Westminster."},{"date":"2026-10-14","jour":"mercredi","fete":"Saint Calixte Ier","detail":"Pape et martyr","classe":"3e cl.","couleur":"rouge","notes":"","noticia":"Pape au IIIe siècle, saint Calixte gouverna l’Église dans une période difficile et défendit la discipline ecclésiastique. La tradition le vénère comme martyr."},{"date":"2026-10-15","jour":"jeudi","fete":"Sainte Thérèse d’Avila","detail":"Vierge","classe":"3e cl.","couleur":"blanc","notes":"","noticia":"Grande réformatrice du Carmel au XVIe siècle, Thérèse de Jésus unit une vie mystique profonde à une remarquable énergie apostolique. Ses écrits sur l’oraison comptent parmi les grands textes de la spiritualité catholique."},{"date":"2026-10-16","jour":"vendredi","fete":"Sainte Hedwige","detail":"Veuve","classe":"3e cl.","couleur":"blanc","notes":"Abstinence","noticia":"Duchesse de Silésie au XIIIe siècle, Hedwige se distingua par la prière, la pénitence et le service des pauvres. Devenue veuve, elle mena une vie retirée auprès du monastère de Trebnitz."},{"date":"2026-10-17","jour":"samedi","fete":"Sainte Marguerite-Marie Alacoque","detail":"Vierge","classe":"3e cl.","couleur":"blanc","notes":"","noticia":"Visitandine de Paray-le-Monial, Marguerite-Marie reçut au XVIIe siècle les révélations qui contribuèrent puissamment à la diffusion de la dévotion au Sacré-Cœur de Jésus."},{"date":"2026-10-18","jour":"dimanche","fete":"XXIe dimanche après la Pentecôte","detail":"","classe":"2e cl.","couleur":"vert","notes":"Saint Luc, évangéliste","noticia":"Brève notice à compléter."},{"date":"2026-10-19","jour":"lundi","fete":"Saint Pierre d’Alcantara","detail":"Confesseur","classe":"3e cl.","couleur":"blanc","notes":"","noticia":"Franciscain espagnol du XVIe siècle, Pierre d’Alcantara mena une vie de grande austérité et d’oraison. Réformateur de son ordre, il fut aussi un conseiller spirituel de sainte Thérèse d’Avila."},{"date":"2026-10-20","jour":"mardi","fete":"Saint Jean de Kenty","detail":"Confesseur","classe":"3e cl.","couleur":"blanc","notes":"","noticia":"Prêtre et professeur à Cracovie au XVe siècle, Jean de Kenty associa l’étude à une grande charité envers les pauvres. Sa vie fut marquée par l’humilité, la pénitence et les pèlerinages."},{"date":"2026-10-21","jour":"mercredi","fete":"De la férie","detail":"","classe":"4e cl.","couleur":"vert","notes":"Saint Hilarion, abbé · Sainte Ursule et ses compagnes, vierges et martyres","noticia":"Jour de férie du temps après la Pentecôte. La liturgie reprend le formulaire du dimanche correspondant, en laissant davantage de place à la continuité du cycle temporal."},{"date":"2026-10-22","jour":"jeudi","fete":"De la férie","detail":"","classe":"4e cl.","couleur":"vert","notes":"","noticia":"Jour de férie du temps après la Pentecôte. La liturgie reprend le formulaire du dimanche correspondant, en laissant davantage de place à la continuité du cycle temporal."},{"date":"2026-10-23","jour":"vendredi","fete":"Saint Antoine-Marie Claret","detail":"Évêque et confesseur","classe":"3e cl.","couleur":"blanc","notes":"Abstinence","noticia":"Évêque missionnaire espagnol du XIXe siècle, Antoine-Marie Claret fonda les Missionnaires Fils du Cœur Immaculé de Marie. Prédicateur infatigable, il travailla à la diffusion de la bonne presse et à la formation chrétienne."},{"date":"2026-10-24","jour":"samedi","fete":"Saint Raphaël Archange","detail":"","classe":"3e cl.","couleur":"blanc","notes":"","noticia":"Raphaël apparaît dans le livre de Tobie comme le guide et le guérisseur envoyé par Dieu. L’Église l’invoque particulièrement pour la protection des voyageurs et la guérison des malades."},{"date":"2026-10-25","jour":"dimanche","fete":"Fête du Christ-Roi","detail":"","classe":"1re cl.","couleur":"blanc","notes":"Indulgence plénière · Acte de consécration au Sacré-Cœur","noticia":"Instituée par Pie XI en 1925, cette fête proclame la royauté universelle de Jésus-Christ sur les personnes, les familles et les sociétés. Elle rappelle que toute autorité et toute vie humaine doivent être ordonnées à Dieu."},{"date":"2026-10-26","jour":"lundi","fete":"De la férie","detail":"","classe":"4e cl.","couleur":"vert","notes":"Saint Évariste, pape et martyr","noticia":"Jour de férie du temps après la Pentecôte. La liturgie reprend le formulaire du dimanche correspondant, en laissant davantage de place à la continuité du cycle temporal."},{"date":"2026-10-27","jour":"mardi","fete":"De la férie","detail":"","classe":"4e cl.","couleur":"vert","notes":"","noticia":"Jour de férie du temps après la Pentecôte. La liturgie reprend le formulaire du dimanche correspondant, en laissant davantage de place à la continuité du cycle temporal."},{"date":"2026-10-28","jour":"mercredi","fete":"Saints Simon et Jude","detail":"Apôtres","classe":"2e cl.","couleur":"rouge","notes":"","noticia":"Simon le Zélote et Jude Thaddée comptent parmi les douze Apôtres choisis par Notre-Seigneur. La tradition les associe dans leur prédication et leur martyre au service de l’Évangile."},{"date":"2026-10-29","jour":"jeudi","fete":"De la férie","detail":"","classe":"4e cl.","couleur":"vert","notes":"","noticia":"Jour de férie du temps après la Pentecôte. La liturgie reprend le formulaire du dimanche correspondant, en laissant davantage de place à la continuité du cycle temporal."},{"date":"2026-10-30","jour":"vendredi","fete":"De la férie","detail":"","classe":"4e cl.","couleur":"vert","notes":"Abstinence","noticia":"Jour de férie du temps après la Pentecôte. La liturgie reprend le formulaire du dimanche correspondant, en laissant davantage de place à la continuité du cycle temporal."},{"date":"2026-10-31","jour":"samedi","fete":"De la Sainte Vierge le samedi","detail":"","classe":"4e cl.","couleur":"blanc","notes":"","noticia":"La messe de la Sainte Vierge le samedi exprime l’antique dévotion de l’Église envers la Mère de Dieu et prépare spirituellement au dimanche, jour du Seigneur."}];let cur=null,active='messe';const L=document.getElementById('list');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
L.innerHTML=DATA.map((x,i)=>`<article class="card" onclick="openM(${i})"><div class="date"><span>${esc(x.jour)}</span><b>${Number(x.date.slice(-2))}</b><span>oct.</span></div><div class="body"><div class="feast">${esc(x.fete)}</div>${x.detail?`<div class="detail">${esc(x.detail)}</div>`:''}<div class="tags"><span class="tag">${esc(x.classe)}</span><span class="tag">${esc(x.couleur)}</span></div>${x.notes?`<div class="notes">${esc(x.notes)}</div>`:''}</div><div class="arr">›</div></article>`).join('');
function openM(i){cur=DATA[i];active='messe';document.getElementById('mtitle').textContent=cur.fete;document.getElementById('msub').textContent=`${cur.jour} ${Number(cur.date.slice(-2))} octobre 2026 · ${cur.classe} · ${cur.couleur}`;document.getElementById('modal').style.display='block';draw()}
function closeM(){document.getElementById('modal').style.display='none'}
function tab(t){active=t;draw()}
function draw(){document.getElementById('tm').className=active==='messe'?'active':'';document.getElementById('tn').className=active==='noticia'?'active':'';
 if(active==='noticia'){document.getElementById('panel').innerHTML=`<h3>Noticia</h3><p>${esc(cur.noticia)}</p>`;return}
 const u='https://ordo.fsspx.org/day/'+cur.date;
 document.getElementById('panel').innerHTML=`<h3>Textes de la messe</h3><div class="masspart"><b>Introït</b></div><div class="masspart"><b>Oraison</b></div><div class="masspart"><b>Épître</b></div><div class="masspart"><b>Graduel / Alléluia</b></div><div class="masspart"><b>Évangile</b></div><div class="masspart"><b>Offertoire</b></div><div class="masspart"><b>Secrète</b></div><div class="masspart"><b>Communion</b></div><div class="masspart"><b>Postcommunion</b></div><div class="source">La structure est prête. Les textes liturgiques complets doivent être intégrés après contrôle du formulaire propre à votre calendrier. <a href="${u}" target="_blank">Consulter l'Ordo de référence du jour</a>.</div>`}
</script></body></html>
