footer{text-align:center;padding:25px;border-top:1px solid var(--line);font-size:13px}
@media(max-width:650px){.day{grid-template-columns:90px 1fr}.day .rank,.day .color{font-size:13px}.today{padding:18px}}

function pretty(e){let d=new Date(e.date+'T12:00:00');return e.jour+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' 2026'}
function showDay(d){
 const e=DATA.find(x=>x.date===iso(d))||DATA[0]; selected=new Date(e.date+'T12:00:00');
 const c=COLORS[e.couleur]||'#b48a16'; let box=document.getElementById('today'); box.style.setProperty('--lit',c);
 document.getElementById('date').textContent=pretty(e);
 document.getElementById('feast').textContent=e.fete;
 document.getElementById('rank').textContent=e.classe||'—';
 document.getElementById('color').textContent=e.couleur?e.couleur[0].toUpperCase()+e.couleur.slice(1):'—';
 document.getElementById('notes').textContent=e.notes||'';
 renderMonth(selected.getMonth());
}
function move(n){let d=new Date(selected);d.setDate(d.getDate()+n);if(d.getFullYear()===2026)showDay(d)}
function renderMonth(m){
 document.getElementById('monthTitle').textContent=MONTHS[m]+' 2026';
 document.querySelectorAll('.months button').forEach((b,i)=>b.classList.toggle('active',i===m));
 const g=document.getElementById('grid');g.innerHTML='';
 DATA.filter(e=>+e.date.slice(5,7)===m+1).forEach(e=>{
  let el=document.createElement('div');el.className='day';el.style.setProperty('--lit',COLORS[e.couleur]||'#b48a16');
  el.innerHTML=`<div class="d">${e.jour} ${+e.date.slice(8)}</div><div><strong>${e.fete}</strong>${e.notes?`<div class="n">${e.notes}</div>`:''}</div><div class="rank">${e.classe}</div><div class="color">${e.couleur}</div>`;
  el.onclick=()=>{showDay(new Date(e.date+'T12:00:00'));scrollTo({top:0,behavior:'smooth'})};g.appendChild(el);
 });
}
window.addEventListener('DOMContentLoaded',()=>{
 const m=document.getElementById('months');MONTHS.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{selected=new Date(`2026-${String(i+1).padStart(2,'0')}-01T12:00:00`);showDay(selected)};m.appendChild(b)});
 showDay(selected);
});
</script></body></html>
